# Deploy everything:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s | kubectl apply -f -
# (the flag lets this reuse the Grafana files in ../monitoring instead of copying them)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pixel-canvas
resources:
  - namespace.yaml
  - redis.yaml
  - app.yaml
  - monitoring.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-datasources
    files:
      - ../monitoring/grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboard-provider
    files:
      - ../monitoring/grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboards
    files:
      - ../monitoring/grafana/dashboards/pixel-canvas.json
