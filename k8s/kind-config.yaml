# Local cluster: kind create cluster --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pixel-canvas
nodes:
  - role: control-plane
    # NodePorts on the cluster, reachable from the laptop
    extraPortMappings:
      - containerPort: 30080 # app (canvas + WebSockets)
        hostPort: 8090
      - containerPort: 30090 # Prometheus
        hostPort: 9091
      - containerPort: 30030 # Grafana
        hostPort: 3031
  - role: worker
  - role: worker
