# App servers: stateless, 3 replicas, spread across nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: pixel-canvas
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pixel-canvas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below 3 ready pods during an update
      maxSurge: 1 # start one new pod at a time
  template:
    metadata:
      labels:
        app: pixel-canvas
    spec:
      # Must be longer than DRAIN_MS + time to close sockets and Redis
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pixel-canvas
      containers:
        - name: app
          image: pixel-canvas:latest
          imagePullPolicy: IfNotPresent # image is loaded into kind, not pulled from a registry
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: BATCH_MS
              value: "100"
            - name: DRAIN_MS
              value: "5000"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 1
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 512Mi
---
# Load balancer in front of the app pods, reachable on the laptop at :8090 (see kind-config.yaml)
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: pixel-canvas
spec:
  type: NodePort
  selector:
    app: pixel-canvas
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
