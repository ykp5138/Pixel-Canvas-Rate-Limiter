# Load balancer in front of the app replicas.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Docker's internal DNS; re-check replica addresses every 10s
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app_servers {
  # Shared across worker processes so round-robin is global, not per worker
  zone app_servers 64k;
  # "app" resolves to every replica of the app service
  server app:3000 resolve;
}

server {
  listen 80;

  location / {
    proxy_pass http://app_servers;
    proxy_http_version 1.1;

    # WebSocket upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Keep idle WebSocket connections open
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
