services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: pixel-canvas:latest
    init: true
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      # Set to "--cpu-prof --cpu-prof-dir=/profiles" to profile
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      # Wait this long after SIGTERM before closing (lets load balancers stop routing here)
      DRAIN_MS: ${DRAIN_MS:-0}
    volumes:
      - ./profiles:/profiles
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Lets k6 push its client-side metrics
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Local only: no login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pixel-canvas.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Load test, only runs on demand: docker compose run --rm k6 run /scripts/swarm.js
  k6:
    image: grafana/k6:2.4.0
    profiles: ["loadtest"]
    environment:
      TARGET: ws://lb:80
      # Push client-side metrics to Prometheus so they show in Grafana
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99)
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      - lb

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
