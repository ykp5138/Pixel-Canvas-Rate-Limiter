<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Canvas</title>
    <style>
      :root {
        --bg: #f4f4f5;
        --panel: #ffffff;
        --text: #18181b;
        --muted: #71717a;
        --border: #d4d4d8;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --panel: #27272a;
          --text: #f4f4f5;
          --muted: #a1a1aa;
          --border: #3f3f46;
          --accent: #60a5fa;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.4 system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      h1 { margin: 0; font-size: 20px; }
      #status { margin: 0; color: var(--muted); min-height: 1.4em; }
      #status.ok { color: #16a34a; }
      #status.bad { color: #dc2626; }
      #canvas {
        width: min(600px, 100%);
        aspect-ratio: 1 / 1;
        image-rendering: pixelated; /* keep pixels crisp when scaled up */
        background: #fff;
        border: 1px solid var(--border);
        cursor: crosshair;
        touch-action: manipulation;
      }
      #info { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
      #palette {
        display: grid;
        grid-template-columns: repeat(8, 32px);
        gap: 6px;
        padding: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .swatch {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0;
        cursor: pointer;
      }
      .swatch.selected { outline: 3px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>Pixel Canvas</h1>
    <p id="status">Connecting…</p>
    <canvas id="canvas" width="100" height="100"></canvas>
    <p id="info">Hover over the canvas</p>
    <div id="palette" aria-label="Color palette"></div>
    <script src="dist/main.js"></script>
  </body>
</html>
