name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build image
        run: docker build -t pixel-canvas:ci .

      # Smoke test runs against the same image that gets deployed
      - name: Start app container
        run: >-
          docker run -d --name app --network host
          -e REDIS_URL=redis://localhost:6379
          pixel-canvas:ci

      - name: Smoke test
        run: npm run smoke

      - name: App logs
        if: failure()
        run: docker logs app

      # Only images that passed the smoke test get published
      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pixel-canvas
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag pixel-canvas:ci "$IMAGE:latest"
          docker tag pixel-canvas:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  # Set repo variables AWS_DEPLOY_ROLE_ARN and EC2_INSTANCE_ID to enable; delete them to disable
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: deploy-ec2
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/pixel-canvas:${{ github.sha }}
        run: |
          jq -n --rawfile script scripts/deploy.sh --arg image "$IMAGE" \
            '{commands: ["export IMAGE=" + $image, $script]}' > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          test "$STATUS" = "Success"
